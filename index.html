<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolkit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f6f4">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f6f4;
  --surface: #ffffff;
  --border: #e8e8e5;
  --text: #1c1c1a;
  --text-muted: #8f8f8a;
  --radius: 14px;
}
 
* {
  box-sizing: border-box;
}
 
body {
  font-family: 'Inter', system-ui, sans-serif;
  max-width: 480px;
  margin: 0 auto;
  padding: 32px 20px 48px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}
 
h1 {
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0 0 20px;
}
 
button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  padding: 16px 2px;
  margin-bottom: 0;
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 500;
  color: var(--text);
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: none;
  box-shadow: none;
  cursor: pointer;
  transition: opacity 0.12s ease;
}
 
button:active {
  background: none;
  opacity: 0.6;
  transform: none;
}
 
#scenarioList button::after {
  content: '\2192';
  color: var(--text-muted);
  margin-left: 12px;
}
 
.card {
  padding: 16px 18px;
  margin-bottom: 10px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--text);
  box-shadow: none;
  font-size: 15.5px;
  line-height: 1.6;
}
 
.card-detail {
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.4;
  margin-top: 6px;
}
 
#backBtn {
  background: none;
  border: none;
  border-bottom: none;
  box-shadow: none;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--text-muted);
  width: auto;
  padding: 0 0 18px 0;
  margin-bottom: 0;
}
 
#backBtn:active {
  background: none;
  opacity: 1;
  color: var(--text);
}
 
.import-link {
  color: var(--text-muted);
  font-size: 13px;
  text-decoration: underline;
  cursor: pointer;
}
 
.import-link:active {
  color: var(--text);
}
 
#homeHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}
 
#homeHeader h1 {
  margin: 0;
}
 
.add-csv-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}
 
.add-csv-label {
  color: var(--text-muted);
  font-size: 13px;
}
 
.add-csv-sep {
  color: var(--border);
  font-size: 13px;
}
 
.url-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}
 
#csvUrlInput {
  flex: 1;
  min-width: 0;
  padding: 9px 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}
 
.url-load-btn {
  display: inline;
  width: auto;
  padding: 0;
  margin: 0;
  border: none;
  border-bottom: none;
  background: none;
  box-shadow: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  text-decoration: underline;
  white-space: nowrap;
  cursor: pointer;
}
 
#emptyState {
  padding: 28px 0;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.5;
}
</style>
</head>
<body>
 
  <div id="homeView">
    <div id="homeHeader">
      <h1>Toolkit</h1>
      <div class="add-csv-controls">
        <span class="add-csv-label">Add CSV:</span>
        <label for="fileInput" class="import-link">Upload</label>
        <span class="add-csv-sep">/</span>
        <span class="import-link" id="showUrlToggle">Load from URL</span>
        <input type="file" id="fileInput" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel,application/csv" style="display:none">
      </div>
    </div>
    <div class="url-row" id="urlRow" style="display:none;">
      <input type="text" id="csvUrlInput" placeholder="CSV URL">
      <button id="loadUrlBtn" type="button" class="url-load-btn">Load</button>
    </div>
    <div id="scenarioList"></div>
    <div id="emptyState" style="display:none;">
      No data yet — import a CSV to get started.
    </div>
  </div>
 
  <div id="scenarioView" style="display:none;">
    <button id="backBtn">&larr; Back</button>
    <h1 id="scenarioTitle"></h1>
    <div id="cardList"></div>
  </div>
 
<script>
  // ---- Data shape: array of { scenario: string, text: string, detail?: string } ----
  // CSV columns expected: scenario,text,detail   (detail is optional — leave blank if not needed)
 
  const STORAGE_KEY = 'toolkitData';
  const CSV_URL_KEY = 'toolkitCsvUrl';
  let data = loadData();
 
  renderHome();
 
  // Silently try refreshing from the last-used URL in the background.
  // If it fails (offline, URL removed, etc.) the current data just stays as-is.
  const savedUrl = localStorage.getItem(CSV_URL_KEY);
  if (savedUrl) {
    document.getElementById('csvUrlInput').value = savedUrl;
    loadCsvFromUrl(savedUrl, true);
  }
 
  document.getElementById('fileInput').addEventListener('change', handleFile);
  document.getElementById('backBtn').addEventListener('click', renderHome);
  document.getElementById('loadUrlBtn').addEventListener('click', () => {
    const url = document.getElementById('csvUrlInput').value.trim();
    if (url) {
      loadCsvFromUrl(url);
      document.getElementById('urlRow').style.display = 'none';
    }
  });
  document.getElementById('showUrlToggle').addEventListener('click', () => {
    const row = document.getElementById('urlRow');
    row.style.display = (row.style.display === 'none') ? 'flex' : 'none';
  });
 
  function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
 
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        applyParsedRows(results.data);
      }
    });
  }
 
  async function loadCsvFromUrl(url, silent = false) {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Network error: ' + response.status);
      const text = await response.text();
 
      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          applyParsedRows(results.data);
          localStorage.setItem(CSV_URL_KEY, url);
        }
      });
    } catch (err) {
      console.error('Failed to load CSV:', err);
      if (!silent) {
        alert(
          'Could not load CSV from that URL.\n\n' +
          'If this is a Dropbox link, "www.dropbox.com" links are blocked for this kind of fetch — ' +
          'try swapping that part of the URL for "dl.dropboxusercontent.com" instead (unofficial, but commonly works).'
        );
      }
    }
  }
 
  function applyParsedRows(rows) {
    // Expect each row: { scenario: '...', text: '...', detail: '...' }
    data = rows.filter(row => row.scenario && row.text);
    saveData(data);
    renderHome();
  }
 
  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }
 
  function saveData(d) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }
 
  function getScenarios() {
    return [...new Set(data.map(row => row.scenario))];
  }
 
  function renderHome() {
    document.getElementById('scenarioView').style.display = 'none';
    document.getElementById('homeView').style.display = 'block';
 
    const listEl = document.getElementById('scenarioList');
    const emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';
 
    const scenarios = getScenarios();
 
    if (scenarios.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
 
    scenarios.forEach(scenario => {
      const btn = document.createElement('button');
      btn.textContent = scenario;
      btn.addEventListener('click', () => renderScenario(scenario));
      listEl.appendChild(btn);
    });
  }
 
  function renderScenario(scenario) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('scenarioView').style.display = 'block';
    document.getElementById('scenarioTitle').textContent = scenario;
 
    const cardListEl = document.getElementById('cardList');
    cardListEl.innerHTML = '';
 
    data
      .filter(row => row.scenario === scenario)
      .forEach(row => {
        const card = document.createElement('div');
        card.className = 'card';
 
        const main = document.createElement('div');
        main.textContent = row.text;
        card.appendChild(main);
 
        if (row.detail && row.detail.trim() !== '') {
          const detail = document.createElement('div');
          detail.className = 'card-detail';
          detail.textContent = row.detail;
          card.appendChild(detail);
        }
 
        cardListEl.appendChild(card);
      });
  }
 
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>
 
</body>
</html>
