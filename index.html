<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toolkit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f6f6f4">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<style>
:root {
--surface: #f3f3f0;
--bg: #ffffff;
  --border: #efefec;
  --text: #1c1c1a;
  --text-muted: #8f8f8a;
  --radius: 14px;
}

* {
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  max-width: 480px;
  margin: 0 auto;
padding: 48px 24px 64px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

h1 {
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0 0 32px;
}


button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  padding: 22px 2px;
  margin-bottom: 0;
  font-family: inherit;
  font-size: 17.5px;
  font-weight: 500;
  color: var(--text);
  border: none;
  border-bottom: 1px solid var(--border);
  border-radius: 0;
  background: none;
  box-shadow: none;
  cursor: pointer;
  transition: opacity 0.12s ease;
}

button:active {
  background: none;
  opacity: 0.6;
  transform: none;
}



.card {
  padding: 26px 24px;
  margin-bottom: 18px;
  border-radius: 14px;
  background: var(--surface);
  border: none;
  box-shadow: none;
  font-size: 16px;
  line-height: 1.55;
}

.card-detail {
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.5;
  margin-top: 14px;
}

.scenario-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}

.scenario-header h1 {
  margin: 0;
}

#backBtn {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 28px;
  height: 28px;
  padding: 0;
  margin: 0;

  background: none;
  border: none;
  color: var(--text-muted);
}

.back-arrow-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}




#backBtn:active {
  opacity: 0.6;
}
#backBtn:active {
  background: none;
  opacity: 1;
  color: var(--text);
}

.import-link {
  color: var(--text-muted);
  font-size: 13px;
  text-decoration: underline;
  cursor: pointer;
}

.import-link:active {
  color: var(--text);
}

#homeHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 32px;
}

#homeHeader h1 {
  margin: 0;
}

.import-controls {
  display: flex;
  align-items: center;
}

.import-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
width: 28px;
height: 28px;
  padding: 0 0 2px;
  margin: 0;
  border: none;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  box-shadow: none;
  font-size: 25px;
  font-weight: 400;
  line-height: 1;
  text-align: center;
  transition: opacity 0.12s ease;
}

.import-add-icon {
  display: block;
  width: 11px;
  height: 11px;
  overflow: visible;
  transform-origin: center;
  transition: transform 0.16s ease;
}

.import-add-btn.open .import-add-icon {
  transform: rotate(45deg);
}

.import-add-btn:active {
  opacity: 0.75;
}

.import-options {
  display: none;
  gap: 14px;
  padding: 0 0 16px;
  margin: -2px 0 14px;
  border-bottom: 1px solid var(--border);
}

.import-options.open {
  display: grid;
}

.import-option {
  display: grid;
  gap: 8px;
}

.upload-option {
  display: flex;
  align-items: center;
  min-height: 24px;
  padding: 0 2px;
}


.section-label {
  display: block;
  padding: 28px 2px 0;
  color: var(--text-muted);
  font-size: 15.5px;
  cursor: pointer;
}

.section-label::before {
  display: none;
}


.section-label.expanded::before {
  transform: rotate(45deg);
}

.url-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

#csvUrlInput,
#metaUrlInput {
  flex: 1;
  min-width: 0;
  padding: 9px 10px;
  font-family: inherit;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
}

.url-load-btn {
  display: inline;
  width: auto;
  padding: 0;
  margin: 0;
  border: none;
  border-bottom: none;
  background: none;
  box-shadow: none;
  color: var(--text-muted);
  font-size: 13px;
  font-weight: 500;
  text-decoration: underline;
  white-space: nowrap;
  cursor: pointer;
}

#emptyState {
  padding: 28px 0;
  color: var(--text-muted);
  font-size: 15px;
  line-height: 1.5;
}
</style>
</head>
<body>

  <div id="homeView">
    <div id="homeHeader">
      <h1>Toolkit</h1>
      <div class="import-controls">
        <button id="addImportToggle" type="button" class="import-add-btn" aria-label="Add CSV options" aria-expanded="false" aria-controls="importOptionsPanel" title="Add CSV options"><svg class="import-add-icon" viewBox="0 0 24 24" aria-hidden="true"><g class="import-add-icon-group"><line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"></line></g></svg></button>
      </div>
    </div>

    <div class="import-options" id="importOptionsPanel">
      <div class="import-option">
          <label for="fileInput" class="import-link upload-option" id="uploadLabel">Upload CSV</label>
          <div class="url-row" id="urlRow">
            <input type="text" id="csvUrlInput" placeholder="CSV URL">
            <button id="loadUrlBtn" type="button" class="url-load-btn">Load</button>
          </div>
      </div>
      <div class="import-option">
          <label for="metaFileInput" class="import-link upload-option" id="metaUploadLabel">Upload timing CSV</label>
          <div class="url-row" id="metaUrlRow">
            <input type="text" id="metaUrlInput" placeholder="Timing CSV URL">
            <button id="loadMetaUrlBtn" type="button" class="url-load-btn">Load</button>
          </div>
      </div>
    </div>
    <input type="file" id="fileInput" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel,application/csv" style="display:none">
    <input type="file" id="metaFileInput" accept=".csv,text/csv,text/comma-separated-values,application/vnd.ms-excel,application/csv" style="display:none">

    <div id="scenarioList"></div>
    <div id="emptyState" style="display:none;">
      No data yet — import a CSV to get started.
    </div>
  </div>

  <div id="scenarioView" style="display:none;">

    <div class="scenario-header">

  <button id="backBtn" aria-label="Back">

    <svg class="back-arrow-icon" viewBox="0 0 16 16" fill="none">
      <path
        d="M14 8H3"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round" />
      <path
        d="M7 4L3 8L7 12"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round" />
    </svg>

  </button>

  <h1 id="scenarioTitle"></h1>

</div>

    <div id="cardList"></div>
  </div>

<script>
  // ---- Main content CSV: scenario,text,detail ----
  // detail is optional — leave blank if not needed.

  // ---- Optional timing CSV: scenario,periods ----
  // One row per scenario (not per card). periods is semicolon-separated,
  // e.g. "morning" or "evening;night". Leave blank / omit the row entirely
  // for scenarios that aren't time-specific. This file is fully optional —
  // everything works exactly the same (just in plain CSV-row order) without it.

  const STORAGE_KEY = 'toolkitData';
  const CSV_URL_KEY = 'toolkitCsvUrl';
  const META_STORAGE_KEY = 'toolkitMeta';
  const META_URL_KEY = 'toolkitMetaUrl';

  // Hardcoded local time ranges (24h clock). Adjust these to taste.
  const TIME_PERIODS = {
    morning: [5, 11],
    midday:  [11, 17],
    evening: [17, 21],
    night:   [21, 5]   // wraps past midnight
  };

  const PINNED_COUNT = 6; // how many scenarios stay always-visible at the top; rest collapse

  let data = loadData();
  let metaData = loadMeta();

  const elements = {
    homeView: document.getElementById('homeView'),
    scenarioView: document.getElementById('scenarioView'),
    scenarioList: document.getElementById('scenarioList'),
    emptyState: document.getElementById('emptyState'),
    importOptions: document.getElementById('importOptionsPanel'),
    importToggle: document.getElementById('addImportToggle')
  };

  renderHome();

  // Silently try refreshing content + timing from their last-used URLs in the
  // background. If either fails (offline, URL removed, etc.) that data just
  // stays as-is.
  const savedUrl = localStorage.getItem(CSV_URL_KEY);
  if (savedUrl) {
    document.getElementById('csvUrlInput').value = savedUrl;
    loadCsvFromUrl(savedUrl, applyParsedRows, CSV_URL_KEY, 'CSV', true);
  }

  const savedMetaUrl = localStorage.getItem(META_URL_KEY);
  if (savedMetaUrl) {
    document.getElementById('metaUrlInput').value = savedMetaUrl;
    loadCsvFromUrl(savedMetaUrl, applyParsedMeta, META_URL_KEY, 'timing CSV', true);
  }

  document.getElementById('fileInput').addEventListener('change', handleFile);
  document.getElementById('backBtn').addEventListener('click', renderHome);
  document.getElementById('loadUrlBtn').addEventListener('click', () => {
    const url = document.getElementById('csvUrlInput').value.trim();
    if (url) {
      loadCsvFromUrl(url, applyParsedRows, CSV_URL_KEY, 'CSV');
      collapseImportOptions();
    }
  });

  document.getElementById('csvUrlInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      document.getElementById('loadUrlBtn').click();
    }
  });

  document.getElementById('addImportToggle').addEventListener('click', () => {
    toggleImportOptions();
  });

  document.getElementById('uploadLabel').addEventListener('click', () => {
    collapseImportOptions();
  });

  function toggleImportOptions() {
    const isOpen = elements.importOptions.classList.toggle('open');
    elements.importToggle.classList.toggle('open', isOpen);
    elements.importToggle.setAttribute('aria-expanded', String(isOpen));
  }

  function collapseImportOptions() {
    elements.importOptions.classList.remove('open');
    elements.importToggle.classList.remove('open');
    elements.importToggle.setAttribute('aria-expanded', 'false');
  }

  // --- same pattern again, for the optional timing CSV ---

  document.getElementById('metaFileInput').addEventListener('change', handleMetaFile);
  document.getElementById('loadMetaUrlBtn').addEventListener('click', () => {
    const url = document.getElementById('metaUrlInput').value.trim();
    if (url) {
      loadCsvFromUrl(url, applyParsedMeta, META_URL_KEY, 'timing CSV');
      collapseImportOptions();
    }
  });

  document.getElementById('metaUrlInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
      document.getElementById('loadMetaUrlBtn').click();
    }
  });

  document.getElementById('metaUploadLabel').addEventListener('click', () => {
    collapseImportOptions();
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      collapseImportOptions();
    }
  });

  function handleFile(e) {
    parseCsvFile(e.target.files[0], applyParsedRows);
  }

  function parseCsvFile(file, onComplete) {
    if (!file) return;

    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: results => onComplete(results.data)
    });
  }

  async function loadCsvFromUrl(url, onComplete, storageKey, label, silent = false) {
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Network error: ' + response.status);
      const text = await response.text();

      Papa.parse(text, {
        header: true,
        skipEmptyLines: true,
        complete: results => {
          onComplete(results.data);
          localStorage.setItem(storageKey, url);
        }
      });
    } catch (err) {
      console.error('Failed to load ' + label + ':', err);
      if (!silent) {
        alert(
          'Could not load ' + label + ' from that URL.\n\n' +
          'If this is a Dropbox link, "www.dropbox.com" links are blocked for this kind of fetch — ' +
          'try swapping that part of the URL for "dl.dropboxusercontent.com" instead (unofficial, but commonly works).'
        );
      }
    }
  }

  function applyParsedRows(rows) {
    // Expect each row: { scenario: '...', text: '...', detail: '...' }
    data = rows.filter(row => row.scenario && row.text);
    saveData(data);
    renderHome();
  }

  function loadData() {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function saveData(d) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
  }

  function handleMetaFile(e) {
    parseCsvFile(e.target.files[0], applyParsedMeta);
  }

  function applyParsedMeta(rows) {
    // Expect each row: { scenario: '...', periods: 'morning;evening' }
    metaData = rows
      .filter(row => row.scenario)
      .map(row => ({
        scenario: row.scenario,
        periods: (row.periods || '')
          .split(';')
          .map(p => p.trim().toLowerCase())
          .filter(Boolean)
      }));
    saveMeta(metaData);
    renderHome();
  }

  function loadMeta() {
    const raw = localStorage.getItem(META_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function saveMeta(m) {
    localStorage.setItem(META_STORAGE_KEY, JSON.stringify(m));
  }

  function getScenarios() {
    return [...new Set(data.map(row => row.scenario))];
  }

  function getCurrentPeriod() {
    const hour = new Date().getHours();
    for (const period in TIME_PERIODS) {
      const [start, end] = TIME_PERIODS[period];
      if (start < end) {
        if (hour >= start && hour < end) return period;
      } else {
        if (hour >= start || hour < end) return period; // wraps midnight
      }
    }
    return null;
  }

  function scenarioMatchesPeriod(scenario, period) {
    if (!period) return false;
    const entry = metaData.find(m => m.scenario === scenario);
    return entry ? entry.periods.includes(period) : false;
  }

  function getOrderedScenarios() {
    const scenarios = getScenarios();
    const period = getCurrentPeriod();
    if (!period) return scenarios;

    const matching = scenarios.filter(s => scenarioMatchesPeriod(s, period));
    const rest = scenarios.filter(s => !scenarioMatchesPeriod(s, period));
    return [...matching, ...rest];
  }

  function renderHome() {
    document.getElementById('scenarioView').style.display = 'none';
    document.getElementById('homeView').style.display = 'block';

    const listEl = document.getElementById('scenarioList');
    const emptyEl = document.getElementById('emptyState');
    listEl.innerHTML = '';

    const scenarios = getOrderedScenarios();

    if (scenarios.length === 0) {
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';

    const pinned = scenarios.slice(0, PINNED_COUNT);
    const more = scenarios.slice(PINNED_COUNT);

    pinned.forEach(scenario => listEl.appendChild(makeScenarioButton(scenario)));

    if (more.length > 0) {
      const toggle = document.createElement('div');
      toggle.className = 'section-label';
      toggle.textContent = 'More...';
      toggle.setAttribute('role', 'button');
      toggle.setAttribute('tabindex', '0');
      toggle.setAttribute('aria-expanded', 'false');
      listEl.appendChild(toggle);

      const moreList = document.createElement('div');
      moreList.style.display = 'none';
      more.forEach(scenario => moreList.appendChild(makeScenarioButton(scenario)));
      listEl.appendChild(moreList);


toggle.addEventListener('click', () => {
  moreList.style.display = 'block';
  toggle.style.display = 'none';
});

    }
  }

  function makeScenarioButton(scenario) {
    const btn = document.createElement('button');
    btn.textContent = scenario;
    btn.addEventListener('click', () => renderScenario(scenario));
    return btn;
  }

  function renderScenario(scenario) {
    document.getElementById('homeView').style.display = 'none';
    document.getElementById('scenarioView').style.display = 'block';
    document.getElementById('scenarioTitle').textContent = scenario;

    const cardListEl = document.getElementById('cardList');
    cardListEl.innerHTML = '';

    data
      .filter(row => row.scenario === scenario)
      .forEach(row => {
        const card = document.createElement('div');
        card.className = 'card';

        const main = document.createElement('div');
        main.textContent = row.text;
        card.appendChild(main);

        if (row.detail && row.detail.trim() !== '') {
          const detail = document.createElement('div');
          detail.className = 'card-detail';
          detail.textContent = row.detail;
          card.appendChild(detail);
        }

        cardListEl.appendChild(card);
      });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js');
    });
  }
</script>

</body>
</html>
